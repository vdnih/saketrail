# NOTE:
# このワークフローはLambda関数のデプロイのみをCI/CDで実施します。
# AWS CDKによるインフラ構築・変更はCI/CDからは実施しません（権限リスク回避のため手動運用）。
# AWSへの認証はGitHub Actions OIDC + IAMロールで行います。

name: Lambda Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'lambda/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'lambda/**'
  release:
    types: [created]

env:
  AWS_REGION: ap-northeast-1
  LAMBDA_FUNCTION_NAME: <your-lambda-function-name>
  LAMBDA_ZIP_PATH: lambda/dist/lambda.zip

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lambdaパッケージ作成（例: zip化）
      - name: Build Lambda package
        working-directory: ./lambda
        run: |
          # ここで必要なビルド・zip化コマンドを記述
          zip -r dist/lambda.zip src/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://${{ env.LAMBDA_ZIP_PATH }} 