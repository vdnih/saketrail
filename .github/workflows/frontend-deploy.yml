# NOTE:
# このワークフローはProduction環境のみを対象とし、mainブランチpush時にフロントエンド資材をS3/CloudFrontにデプロイします。
# staging環境は現時点では利用しないため、関連設定はコメントアウトしています。
# AWS CDKによるインフラ構築・変更はCI/CDからは実施しません。
# AWSへの認証はGitHub Actions OIDC + IAMロールで行います。

name: Frontend Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'

env:
  AWS_REGION: ap-northeast-1
  # STAGING_BUCKET: staging-saketrail-frontend  # stagingは未使用
  PRODUCTION_BUCKET: production-saketrail-frontend

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'

      - name: Install dependencies
        working-directory: ./frontend
        run: flutter pub get

      - name: Run tests
        working-directory: ./frontend
        run: flutter test

      - name: Build web
        working-directory: ./frontend
        run: flutter build web --release

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Productionデプロイのみ有効
      - name: Deploy to production
        working-directory: ./frontend/build/web
        run: |
          aws s3 sync . s3://${{ env.PRODUCTION_BUCKET }} --delete
          aws cloudfront create-invalidation --distribution-id ${{ secrets.PRODUCTION_DISTRIBUTION_ID }} --paths "/*"
      # - name: Deploy to staging
      #   if: false  # stagingは未使用
      #   run: echo "staging deploy is disabled" 